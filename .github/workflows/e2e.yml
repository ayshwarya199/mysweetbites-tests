name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you start it by hand from the Actions tab

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps msedge

      - name: Start the shop (WordPress + database)
        run: docker compose up -d --wait

      - name: Seed the shop (WooCommerce, products, coupon, shipping)
        run: docker compose run --rm wpcli

      - name: Wait until the shop answers
        run: |
          for i in $(seq 1 30); do
            curl -fsL http://localhost:8080/shop/ -o /dev/null && exit 0
            sleep 2
          done
          echo "Shop did not become ready"; exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=edge --reporter=list,html
        env:
          BASE_URL: http://localhost:8080
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Show shop logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop the shop
        if: always()
        run: docker compose down -v